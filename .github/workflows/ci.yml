name: CI

on:
  push:
    branches: [ master ]
  pull_request:
    branches: [ master ]

jobs:
  test-and-verify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository with submodules
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Checkout temple
        uses: actions/checkout@v7
        with:
          repository: boxxxie/temple
          ref: main
          path: .tmp/temple
          submodules: false
          persist-credentials: false

      - name: Checkout hugi v0.2.0 (runner only)
        uses: actions/checkout@v7
        with:
          repository: boxxxie/hugi
          ref: v0.2.0
          path: .tmp/hugi
          submodules: false
          persist-credentials: false

      - name: Init hugi obench submodule
        run: git -C .tmp/hugi submodule update --init deps/obench

      - name: Setup Odin compiler
        uses: laytan/setup-odin@v2
        with:
          release: latest
          token: ${{ secrets.GITHUB_TOKEN }}
          cache: false

      - name: Run AST Metaprogramming Codegen & Verify Zero Drift
        run: |
          odin run tools/heimdall_gen -vet -strict-style -vet-tabs -vet-packages:main,heimdall_codegen -- tests
          git diff --exit-code heimdall/schema_gen.odin tests/dsl_atdd_gen.odin

      - name: Type-check Heimdall library & codegen packages
        run: |
          odin check heimdall -no-entry-point -vet -strict-style -vet-tabs -custom-attribute:telemetry_schema -vet-packages:heimdall
          odin check heimdall/codegen -no-entry-point -vet -strict-style -vet-tabs -vet-packages:heimdall_codegen

      - name: Run 4-layer ATDD specification suite (with memory leak detection)
        run: |
          odin test tests -vet -strict-style -vet-tabs -custom-attribute:telemetry_schema -vet-packages:heimdall_tests,heimdall,heimdall_codegen

      - name: Verify package documentation generation
        run: |
          odin doc heimdall -custom-attribute:telemetry_schema > /dev/null

      - name: Type-check benchmark suite
        run: |
          odin check benchmarks -collection:hugi=.tmp/hugi/hugi -collection:obench=.tmp/hugi/deps/obench/obench -vet -strict-style -vet-tabs -custom-attribute:telemetry_schema -vet-packages:heimdall_benchmarks,heimdall
          odin run .tmp/temple/cli -- --check --warn-unused benchmarks/render -out:benchmarks/render/templates_gen.odin -pkg:bench_render -temple-import:temple:.
          odin check benchmarks/render -collection:temple=.tmp/temple -vet -strict-style -vet-tabs -vet-packages:bench_render
          odin test benchmarks/render -collection:temple=.tmp/temple -define:ODIN_TEST_FANCY=false -define:ODIN_TEST_FAIL_ON_BAD_MEMORY=true
